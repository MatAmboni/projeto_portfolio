services:
  postgres:
    image: postgres:17-alpine
    container_name: arroz-erp-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: arroz
      POSTGRES_PASSWORD: arroz_dev
      POSTGRES_DB: arroz_erp
    ports:
      - '5432:5432'
    volumes:
      - arroz-erp-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U arroz -d arroz_erp']
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  arroz-erp-postgres-data:
